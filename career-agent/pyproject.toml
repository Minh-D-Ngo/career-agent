[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-agent"
version = "0.1.0"
description = "A local-first career assistant, built incrementally"
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3", "langgraph>=1,<2", "langsmith>=0.14.9,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]
model = ["openai>=2,<3"]
documents = ["pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.scripts]
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
